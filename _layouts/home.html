---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-6">
    <h3 class="fw-bold">About Me</h3>
    {{ content }}
  </div>
  <div class="col-md-6">
    <img src="{{ site.github.url }}/assets/img/home.jpg" alt="Home" width="100%">
  </div>
</div>

<div class="row g-5 mb-5">
  <div class="col-md-6">
    <h3 class="fw-bold border-bottom pb-3 mb-5">Contact</h3>
    {% include contact.html %}
  </div>
  <div class="col-md-6">
    <h3 class="fw-bold border-bottom pb-3 mb-5">Social</h3>
    <div class="social-links">
      {% for social in site.data.settings.social %}
        <p><a href="{{ social.link }}">{{ social.icon | capitalize }}</a></p>
      {% endfor %}
    </div>
  </div>
</div>
