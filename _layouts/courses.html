---
layout: default
---

{{ content }}

<div class="row g-2 mb-2">
  <div>
    <div class="section-heading-row">
      <h3 class="fw-bold">Courses</h3>
    </div>

    <div class="row g-5 mb-5">
      <div class="col-md-2">
        <h4>Teaching</h4>
      </div>
      <div class="col-md-10">
        {% for teaching in site.data.courses-taught %}
        <div class="cv-entry">
          <p class="fw-bold mb-1">{{ teaching.course }}</p>
          <p class="mb-1">{{ teaching.role }}, {{ teaching.year }}, {{ teaching.institution }}</p>
          {% if teaching.syllabus %}
          <p><a href="{{ teaching.syllabus | relative_url }}" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> Syllabus</a></p>
          {% endif %}
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
