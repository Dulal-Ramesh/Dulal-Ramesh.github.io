<header class="d-flex flex-column flex-md-row align-items-center pb-2 mb-2 border-bottom">
  <div>
    <!-- site title links to home -->
    <a href="{{ '/' | relative_url }}" class="d-flex align-items-center text-decoration-none">
      <span class="fs-4 fw-bold">{{ site.title }}</span>
    </a>
    <!-- site description also links to home (optional) -->
    <a href="{{ '/' | relative_url }}" class="d-flex align-items-center text-decoration-none">
      <span>{{ site.description }}</span>
    </a>
  </div>

  <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
    {% for item in site.data.settings.menu %}
      <a class="me-3 py-2 text-decoration-none"
         href="{{ item.url | relative_url }}">{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
