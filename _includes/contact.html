<div class="col-md-6">
  {% for contact in site.data.settings.contacts %}
    <p style="margin-bottom: 0.5rem;">{{ contact.department }}</p>
    <p style="margin-bottom: 0.5rem;">{{ contact.institution }}</p>
    <p style="margin-bottom: 0.5rem;">{{ contact.institution_address }}</p>
    <p style="margin-bottom: 0.5rem;">Email: {{ contact.email }}</p>
    <p style="margin-bottom: 0.5rem;">Phone: {{ contact.phone }}</p>
  {% endfor %}
</div>
